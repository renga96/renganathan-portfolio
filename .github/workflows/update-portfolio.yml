name: Generate Portfolio Update

on:
  push:
    branches:
      - main
    paths:
      - "profile.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate portfolio
        run: python scripts/generate_portfolio.py

      - name: Create approval Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/portfolio-update
          delete-branch: true
          title: "Portfolio update for review"
          commit-message: "Update portfolio from profile.json"
          body: |
            An update was generated from profile.json.

            Please review the portfolio changes before merging.
            The live GitHub Pages website will update after this PR is merged.
